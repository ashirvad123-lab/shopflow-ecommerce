{% extends "base.html" %}

{% block title %}Create Account - ShopFlow{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-person-plus-fill fs-2"></i>
          </div>
          <h3 class="fw-bold mb-1">Create an Account</h3>
          <p class="text-muted small">Join ShopFlow to track orders and save your shipping preferences</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold">Username <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control" id="username" name="username" placeholder="e.g. johndoe" value="{{ username or '' }}" required minlength="3">
            </div>
            <div class="form-text small text-muted">At least 3 characters, unique.</div>
          </div>

          <div class="mb-3">
            <label for="full_name" class="form-label small fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-card-text text-muted"></i></span>
              <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. John Doe" value="{{ full_name or '' }}">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="e.g. john@example.com" value="{{ email or '' }}" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required minlength="6">
              </div>
              <div class="form-text small text-muted">Minimum 6 characters.</div>
            </div>

            <div class="col-md-6">
              <label for="confirm_password" class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required minlength="6">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-semibold shadow-sm mb-3">
            <i class="bi bi-check-circle me-1"></i> Register Account
          </button>

          <div class="text-center small text-muted">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign in here</a>
          </div>
        </form>
      </div>

    </div>
  </div>

</div>
{% endblock %}
