{% extends "base.html" %}

{% block title %}Page Not Found (404) - ShopFlow{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary mb-2">404</div>
    <h2 class="fw-bold mb-3">Oops! Page Not Found</h2>
    <p class="text-muted mb-4 lead">
      The product, order, or page you were looking for does not exist or has been relocated.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4 shadow-sm">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
      <a href="{{ url_for('main.products') }}" class="btn btn-outline-secondary rounded-pill px-4">
        Browse Catalog
      </a>
    </div>
  </div>
</div>
{% endblock %}
